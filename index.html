<!DOCTYPE html>
<html>
<head>
    <title>Track Global Shipment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>#map { height: 350px; width: 100%; display: none; margin-top: 20px; }</style>
</head>
<body class="bg-light">
    <div class="container text-center mt-5">
        <h1 class="display-4 fw-bold text-primary">Track Global Shipment</h1>
        <p class="lead">Enter your unique ID to see your package location.</p>
        
        <div class="input-group mb-3 w-50 mx-auto shadow-sm">
            <input type="text" id="trackInput" class="form-control form-control-lg" placeholder="e.g. SHP-1234">
            <button onclick="trackItem()" class="btn btn-success btn-lg">Track Package</button>
        </div>
        
        <div id="result" class="mt-4 p-4 border rounded bg-white shadow mx-auto w-75 d-none">
            <div class="row">
                <div class="col-md-6 text-start">
                    <h3 id="resStatus" class="text-success fw-bold"></h3>
                    <p><strong>Current Location:</strong> <span id="resLoc"></span></p>
                    <p><strong>Recipient:</strong> <span id="resName"></span></p>
                </div>
                <div class="col-md-6 border-start">
                    <p class="text-muted small">Package Real-Time View</p>
                    <div id="map" class="rounded shadow-sm"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
    <script>
        let map;

        function trackItem() {
            const input = document.getElementById('trackInput').value.toUpperCase();
            const item = shipments.find(s => s.id === input);
            const resultDiv = document.getElementById('result');
            const mapDiv = document.getElementById('map');

            if (item) {
                resultDiv.classList.remove('d-none');
                mapDiv.style.display = 'block';
                document.getElementById('resStatus').innerText = item.status;
                document.getElementById('resLoc').innerText = item.location;
                document.getElementById('resName').innerText = item.recipient;

                // Update Map
                if (map) { map.remove(); }
                map = L.map('map').setView([item.lat, item.lng], 10);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                L.marker([item.lat, item.lng]).addTo(map)
                    .bindPopup(`<b>${item.id}</b><br>${item.location}`)
                    .openPopup();
            } else {
                alert("Tracking ID not found! Visit the Admin Panel to create one.");
            }
        }
    </script>
</body>
</html>
