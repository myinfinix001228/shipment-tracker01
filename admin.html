<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Secure Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <div class="card p-4 shadow-lg bg-secondary text-white">
            <h2>Admin: Create New Shipment</h2>
            <hr>
            <input type="text" id="recipient" class="form-control mb-2" placeholder="Recipient Name">
            <input type="text" id="locationName" class="form-control mb-2" placeholder="City/State Name (e.g. Lagos, Nigeria)">
            
            <div class="row">
                <div class="col"><input type="text" id="lat" class="form-control mb-2" placeholder="Latitude (e.g. 6.52)"></div>
                <div class="col"><input type="text" id="lng" class="form-control mb-2" placeholder="Longitude (e.g. 3.37)"></div>
            </div>
            <p class="small text-warning">*Tip: Search Google for "City Name coordinates" to get Lat/Lng.</p>

            <button onclick="generateTracking()" class="btn btn-primary w-100 fw-bold">GENERATE TRACKING NUMBER</button>
            <div id="newId" class="mt-3 text-center h4 text-warning"></div>
            <hr>
            <a href="index.html" class="btn btn-outline-light btn-sm">View Tracking Page</a>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // --- PASSWORD PROTECTION ---
        const pass = prompt("Enter Admin Password:");
        if (pass !== "Egedeh01") {
            alert("Access Denied!");
            window.location.href = "index.html";
        }

        function generateTracking() {
            const recipient = document.getElementById('recipient').value;
            const locName = document.getElementById('locationName').value;
            const lat = document.getElementById('lat').value;
            const lng = document.getElementById('lng').value;
            
            if(!recipient || !locName || !lat || !lng) return alert("Fill all fields!");

            const id = "SHP-" + Math.floor(1000 + Math.random() * 9000);
            const newShipment = { 
                id, 
                recipient, 
                location: locName, 
                lat: parseFloat(lat), 
                lng: parseFloat(lng), 
                status: "In Transit" 
            };
            
            shipments.push(newShipment);
            saveShipments();
            document.getElementById('newId').innerHTML = `SUCCESS! ID: <strong>${id}</strong>`;
        }
    </script>
</body>
</html>
